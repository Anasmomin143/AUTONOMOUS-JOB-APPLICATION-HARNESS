[project]
name = "job-application-harness"
version = "0.1.0"
description = "Autonomous, human-supervised job application harness for Claude Code"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.47",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "jinja2>=3.1",
    "weasyprint>=62.3",
    "httpx>=0.27",
    "pypdf>=4.3",
    "python-dateutil>=2.9",
]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
where = ["scripts"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
